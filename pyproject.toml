[project]
name = "ledgersync-free"
version = "0.1.0"
description = "Previews reconciliation of local trade/position/equity state against IBKR's Flex Query reporting data. Matches and prints -- does not write corrections. See LedgerSync (Pro) to apply them."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Muhammad Tahir Hameed" }]
keywords = ["interactive-brokers", "ibkr", "trading", "reconciliation", "flex-query", "accounting", "broker-reconciliation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
# Only the Flex Query side -- a plain HTTP + XML polling flow. No optional
# ib_insync extra here: the live-position cross-check diagnostic is a
# LedgerSync (Pro)-only component, not included in this package at all.
dependencies = ["requests>=2.28"]

[project.scripts]
ledgersync = "ledgersync.cli:main"

[tool.setuptools]
packages = ["ledgersync", "diagnostics"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
